# A composite action, not a Docker one: the tool is plain Node with no dependencies, so a
# container would add a minute of build time to a check that otherwise takes seconds.
name: 'control-arm'
description: 'Prove the tests in this PR fail without it'
inputs:
  base:
    description: 'Branch this PR targets. The comparison uses the MERGE BASE with it, never its tip.'
    required: false
    default: 'develop'
  comment:
    description: 'Post the result as a PR comment. Needs pull-requests:write and GH_TOKEN.'
    required: false
    default: 'true'
  fail-on-blind:
    description: >-
      Fail the check when NO case in the PR discriminates. Default false: a PR can
      legitimately ship only regression guards, and a gate that fires on those gets
      switched off within a week.
    required: false
    default: 'false'
  timeout-ms:
    required: false
    default: '180000'
outputs:
  verdict:
    description: 'CAUGHT | BLIND | INCONCLUSIVE | FLAKY | SKIPPED'
    value: ${{ steps.run.outputs.verdict }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        CA_BASE: ${{ inputs.base }}
        CA_TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -uo pipefail
        # The merge base needs both histories. A shallow checkout has neither.
        git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=200 origin "$CA_BASE" 2>/dev/null || true
        TIP="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

        OUT=$(node "${{ github.action_path }}/bin/ca.mjs" verify "$TIP" \
                --against "origin/$CA_BASE" \
                --repo "$GITHUB_WORKSPACE" \
                --timeout "$CA_TIMEOUT" 2>&1) || true
        echo "$OUT"

        # `|| true` is load-bearing. GitHub runs bash steps with `set -e` by default, and
        # `set -uo pipefail` above does not unset it. A grep that finds nothing exits 1,
        # pipefail propagates it, and the step dies BEFORE the :-INCONCLUSIVE fallback can
        # run. That is exactly what happens on a PR the tool declines — a workflow-only
        # change with no test — so the one case designed to be a non-event failed the check.
        VERDICT=$(printf '%s' "$OUT" | grep -oE 'VERDICT +[A-Z]+' | awk '{print $2}' | head -1 || true)
        VERDICT="${VERDICT:-INCONCLUSIVE}"
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

        # A declined commit has nothing useful to say on a PR. Writing an empty file is
        # what makes the comment step skip cleanly rather than posting a blank.
        if [ "$VERDICT" = "SKIPPED" ]; then
          echo "nothing to report: $(printf '%s' "$OUT" | tail -1)"
          : > "$RUNNER_TEMP/ca-comment.md"
        else
          MD=$(node "${{ github.action_path }}/bin/ca.mjs" verify "$TIP" \
                 --against "origin/$CA_BASE" --pr-comment \
                 --repo "$GITHUB_WORKSPACE" --timeout "$CA_TIMEOUT" 2>/dev/null) || true
          printf '%s' "$MD" > "$RUNNER_TEMP/ca-comment.md"
        fi

    - shell: bash
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # node, not `gh`. The CLI is not installed on every runner — a self-hosted
        # bare-metal box failed here with `gh: command not found` after every other step
        # had passed, so the tool ran, reached the right verdict, and could not say so.
        node "${{ github.action_path }}/scripts/gh-api.mjs" upsert-pr-comment \
          "${{ github.repository }}" \
          "${{ github.event.pull_request.number }}" \
          "$RUNNER_TEMP/ca-comment.md" \
          '### `control-arm`'

    - shell: bash
      if: inputs.fail-on-blind == 'true' && steps.run.outputs.verdict == 'BLIND'
      run: |
        echo "::error::No test in this PR fails without the change."
        exit 1
